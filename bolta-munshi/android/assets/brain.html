<!doctype html>
<meta charset="utf-8">
<script src="brain.js"></script>
<script>
// Bridge between the Android app and brain.js. The app keeps the saved file;
// this page keeps the working copy and hands it back whenever it changes.
var db = Munshi.emptyDb();
function init(json) {
  try {
    var d = JSON.parse(json);
    if (Munshi.isDb(d)) db = d;
  } catch (e) {}
  return 'ready';
}
/** Swap in a backup file; refuses anything that is not a hisaab. */
function restore(json) {
  try {
    var d = JSON.parse(json);
    if (!Munshi.isDb(d)) return '';
    db = d;
    Munshi.handle('', db);                 // brings an older file up to date
    return Munshi.lasting(db);
  } catch (e) { return ''; }
}
function greet() { return JSON.stringify(Munshi.greet(db)); }
/** `guesses` is the recogniser's list of what it may have heard, best first. */
function ask(guesses) {
  var r = Munshi.handleBest(guesses, db, new Date());
  return JSON.stringify({ speak: r.speak, action: r.action || '', db: r.changed ? Munshi.lasting(db) : '' });
}
</script>
