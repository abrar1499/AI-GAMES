<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  #brain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<canvas id="brain"></canvas>
<script src="bank.js"></script>
<script src="brain.js"></script>
<script src="visual.js"></script>
<script>
// Bridge between the Android app, the brain on screen (visual.js) and brain.js. The app keeps the saved file;
// this page keeps the working copy and hands it back whenever it changes.
var visual = MunshiVisual.create(document.getElementById('brain'));
visual.start();
/** 'idle' | 'listening' | 'speaking' */
function show(state) { visual.setState(state); }
/** How loud the microphone is right now, 0..1. */
function level(v) { visual.setLevel(v); }

var db = Munshi.emptyDb();
function init(json) {
  try {
    var d = JSON.parse(json);
    db = Munshi.isDb(d) ? d : Munshi.emptyDb();
  } catch (e) { db = Munshi.emptyDb(); }
  return 'ready';
}
/** Swap in a backup file; refuses anything that is not a hisaab. */
function restore(json) {
  try {
    var d = JSON.parse(json);
    if (!Munshi.isDb(d)) return '';
    db = d;
    Munshi.handle('', db);                 // brings an older file up to date
    return Munshi.lasting(db);
  } catch (e) { return ''; }
}
function greet() { return JSON.stringify(Munshi.greet(db)); }
/** `guesses` is the recogniser's list of what it may have heard, best first. */
function ask(guesses) {
  // "did": the brain itself kept or changed something the user asked for (a note, their name), so its own answer stands
  var before = JSON.stringify([db.notes, db.profile]);
  var out = JSON.parse(reply(guesses, Munshi.handleBest(guesses, db, new Date())));
  out.did = JSON.stringify([db.notes, db.profile]) !== before;
  return JSON.stringify(out);
}

/** Whether to show this sentence to the teacher, and if so the request to send. */
function plan(guesses) { return JSON.stringify(Munshi.prepare(guesses, db, new Date())); }
/** Answer with the teacher's verdict ('' when the teacher could not be reached). */
function taught(guesses, verdict) {
  var out = JSON.parse(reply(guesses, Munshi.answer(guesses, verdict || null, db, new Date())));
  // the teacher's plain command, so the app can hand it to BolKhata's ledger
  try { var v = JSON.parse(String(verdict).slice(String(verdict).indexOf('{'), String(verdict).lastIndexOf('}') + 1)); if (v && v.verdict === 'command') out.cmd = String(v.command || ''); } catch (e) {}
  return JSON.stringify(out);
}

/** BolKhata's ledger keeps the hisaab: this brain only talks, and its old money records are handed over once. */
function chatOnly() { Munshi.setChatOnly(true); }
function oldHisaab() { return JSON.stringify({ entries: db.entries || [] }); }
function dropHisaab() { db.entries = []; return Munshi.lasting(db); }

function reply(guesses, r) {
  var now = new Date();
  guesses = [].concat(guesses);
  return JSON.stringify({ speak: r.speak, action: r.action || '', db: r.changed ? Munshi.lasting(db) : '', line: logLine(guesses, r, now) });
}

/** Lessons shared by everyone, fetched from GitHub. Returns the saved data if anything was added. */
function absorb(json) { return Munshi.absorbShared(db, json) > 0 ? Munshi.lasting(db) : ''; }
/** The shared lessons file with this phone's lessons added, or '' if it has nothing new. */
function shareFile(remote) { return Munshi.mergeShared(db, remote || ''); }
/**
 * One line of plain text per exchange, for the app's full conversation file.
 * That file is only ever added to, so unlike the short record kept inside the
 * saved data, nothing in it is ever dropped.
 */
function logLine(guesses, r, now) {
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var when = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate()) + ' ' + two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds());
  if (r.mark) return when + ' | ^^^ UPAR WALA JAWAB GHALAT THA';
  var last = db.log[db.log.length - 1] || {}, others = guesses.filter(function (g) { return g !== last.heard; });
  return when + ' | SUNA: ' + (last.heard || guesses[0]) + (others.length ? ' | DOOSRE ANDAZE: ' + others.join(' / ') : '') +
         ' | JAWAB: ' + r.show + (last.result ? ' | [' + last.result + ']' : '') + (last.teacher ? ' | USTAD: ' + last.teacher : '');
}
</script>
