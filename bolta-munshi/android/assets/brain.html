<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  #brain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<canvas id="brain"></canvas>
<script src="brain.js"></script>
<script src="visual.js"></script>
<script>
// Bridge between the Android app, the brain on screen (visual.js) and brain.js. The app keeps the saved file;
// this page keeps the working copy and hands it back whenever it changes.
var visual = MunshiVisual.create(document.getElementById('brain'));
visual.start();
/** 'idle' | 'listening' | 'speaking' */
function show(state) { visual.setState(state); }
/** How loud the microphone is right now, 0..1. */
function level(v) { visual.setLevel(v); }

var db = Munshi.emptyDb();
function init(json) {
  try {
    var d = JSON.parse(json);
    if (Munshi.isDb(d)) db = d;
  } catch (e) {}
  return 'ready';
}
/** Swap in a backup file; refuses anything that is not a hisaab. */
function restore(json) {
  try {
    var d = JSON.parse(json);
    if (!Munshi.isDb(d)) return '';
    db = d;
    Munshi.handle('', db);                 // brings an older file up to date
    return Munshi.lasting(db);
  } catch (e) { return ''; }
}
function greet() { return JSON.stringify(Munshi.greet(db)); }
/** `guesses` is the recogniser's list of what it may have heard, best first. */
function ask(guesses) {
  var now = new Date(), r = Munshi.handleBest(guesses, db, now);
  return JSON.stringify({ speak: r.speak, action: r.action || '', db: r.changed ? Munshi.lasting(db) : '', line: logLine(guesses, r, now) });
}
/**
 * One line of plain text per exchange, for the app's full conversation file.
 * That file is only ever added to, so unlike the short record kept inside the
 * saved data, nothing in it is ever dropped.
 */
function logLine(guesses, r, now) {
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var when = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate()) + ' ' + two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds());
  if (r.mark) return when + ' | ^^^ UPAR WALA JAWAB GHALAT THA';
  var last = db.log[db.log.length - 1] || {}, others = guesses.filter(function (g) { return g !== last.heard; });
  return when + ' | SUNA: ' + (last.heard || guesses[0]) + (others.length ? ' | DOOSRE ANDAZE: ' + others.join(' / ') : '') +
         ' | JAWAB: ' + r.show + (last.result ? ' | [' + last.result + ']' : '');
}
</script>
