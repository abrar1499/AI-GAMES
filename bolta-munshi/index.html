<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolta Munshi</title>
<meta name="theme-color" content="#10151c">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>Bolta Munshi</h1>
  <nav>
    <button type="button" id="openBook" class="ghost">Hisaab</button>
    <button type="button" id="openSettings" class="ghost" aria-label="Settings">Settings</button>
  </nav>
</header>

<main>
  <section class="call" aria-live="polite">
    <button type="button" id="orb" class="orb" data-state="idle" aria-label="Call shuru karein">
      <span class="ring"></span>
      <span class="orb-label" id="orbLabel">Call shuru karein</span>
    </button>
    <p id="status" class="status">Button dabayein aur bolna shuru karein.</p>
    <p id="interim" class="interim"></p>
    <p id="notice" class="notice" hidden></p>
  </section>

  <section class="chat" id="chat" aria-label="Baat cheet"></section>
</main>

<form id="typeForm" class="typer" autocomplete="off">
  <input id="typeBox" type="text" placeholder="Ya yahan likh dein, jaise: 500 ka petrol dala" aria-label="Likh kar batayein">
  <button type="submit">Bhejein</button>
</form>

<dialog id="book" class="sheet">
  <header><h2>Hisaab</h2><button type="button" class="ghost" data-close>Band karein</button></header>
  <div id="bookBody" class="sheet-body"></div>
</dialog>

<dialog id="settings" class="sheet">
  <header><h2>Settings</h2><button type="button" class="ghost" data-close>Band karein</button></header>
  <div class="sheet-body">
    <label class="field">Awaaz aur zabaan
      <select id="mode">
        <option value="auto">Khud chun lo</option>
        <option value="ur">Urdu</option>
        <option value="hi">Hindi awaaz (jab Urdu awaaz na ho)</option>
        <option value="en">English awaaz, Roman Urdu</option>
      </select>
    </label>
    <p id="voiceInfo" class="hint"></p>
    <label class="field">Bolne ki raftaar
      <input id="rate" type="range" min="0.7" max="1.3" step="0.05" value="1">
    </label>
    <div class="row">
      <button type="button" id="exportBtn">Backup download karein</button>
      <button type="button" id="importBtn">Backup wapas layein</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <button type="button" id="clearBtn" class="danger">Sab kuch mita dein</button>
    <p class="hint">Aap ka sara hisaab sirf isi browser mein save hota hai. Browser ka data saaf karne se yeh bhi mit jaye ga, is liye kabhi kabhi backup le lein.</p>
  </div>
</dialog>

<script src="brain.js"></script>
<script src="app.js"></script>
</body>
</html>
