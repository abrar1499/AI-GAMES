<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolta Munshi</title>
<meta name="theme-color" content="#000000">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  /* The whole screen is the only control: tap to start the call, tap to end it. */
  #call { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: #000;
          cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  #call:focus-visible { outline: 2px solid #35c28b; outline-offset: -6px; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #2a2f36; }
  #call[data-state="listening"] #dot { background: #35c28b; animation: beat 1.4s ease-in-out infinite; }
  #call[data-state="speaking"] #dot { background: #f0b24a; animation: beat .6s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.9); opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none !important; } }
  /* Only ever shows a problem that cannot be spoken, such as the mic being blocked. */
  #problem { position: fixed; left: 16px; right: 16px; bottom: 24px; margin: 0; text-align: center; pointer-events: none;
             color: #f0b24a; font: 15px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<button type="button" id="call" data-state="idle" aria-label="Call shuru karein"><span id="dot"></span></button>
<p id="problem" role="alert"></p>
<script src="brain.js"></script>
<script src="app.js"></script>
</body>
</html>
