<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Book</title>
<meta name="theme-color" content="#000000">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  /* The whole screen is the only control: tap to start the call, tap to end it. */
  #call { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: #000;
          cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #call:focus-visible { outline: 2px solid #35c28b; outline-offset: -6px; }
  /* The brain is the whole screen; taps go through it to the button. */
  #brain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* Only ever shows a problem that cannot be spoken, such as the mic being blocked. */
  #problem { position: fixed; left: 16px; right: 16px; bottom: 24px; margin: 0; text-align: center; pointer-events: none;
             color: #f0b24a; font: 15px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<button type="button" id="call" data-state="idle" aria-label="Call shuru karein"><canvas id="brain"></canvas></button>
<p id="problem" role="alert"></p>
<script src="data/bank.js"></script>
<script src="brain.js"></script>
<script src="visual.js"></script>
<script src="app.js"></script>
</body>
</html>
